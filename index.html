<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5fd1">
<meta name="robots" content="noindex, nofollow">
<title>Next Step CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NSD CRM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="auth" hidden></div>
<div class="app" id="app" hidden>
  <aside class="rail" aria-label="Main">
    <div class="brand">Next Step CRM<small>Next Step Digital</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sync" id="sync"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="vtitle">Today</h1>
      <span class="grow"></span>
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search companies, people, deals, tasks" autocomplete="off" aria-label="Search everything">
        <div class="results" id="results" hidden></div>
      </div>
      <button class="btn primary" id="addBtn" type="button">+ New</button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<nav class="mobnav" id="mobnav" aria-label="Main" hidden></nav>
<div id="layer"></div>
<div id="toastbox"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
